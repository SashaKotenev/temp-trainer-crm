<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#255b4e"><title>ТЕМП — рабочий кабинет тренера</title><meta name="description" content="Демонстрационная CRM тренера: клиенты, продажи, расписание, тренировки и оплаты."><link rel="stylesheet" href="style.css"></head><body>
